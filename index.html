<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecommerce Landing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo">ShopLogo</div>
    <nav class="nav">
      <a href="#">Головна</a>
      <a href="#">Каталог</a>
      <a href="#">Про нас</a>
      <a href="#">Контакти</a>
    </nav>
    <div class="header-actions">
      <a href="#" class="login">Увійти</a>
      <button class="btn">Реєстрація</button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-text">
      <h1>Стильна колекція 2025</h1>
      <p>Відкрий новий образ з нашими модними новинками. Доставляємо по всій Україні.</p>
      <div class="hero-buttons">
        <button class="btn">Купити зараз</button>
        <a href="#" class="link">Переглянути каталог</a>
      </div>
    </div>
    <div class="hero-img">
      <img src="images/product-hero.jpg" alt="Product">
    </div>
  </section>

  <footer class="footer">
    <p>© 2025 Мій Магазин. Всі права захищенні.</p>
  </footer>
</body>
</html>
